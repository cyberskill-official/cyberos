# TASK-OBS-004 — self-hosted LangSmith (local / lab). Not the langchain.com SaaS.
#
#   docker compose -f deploy/obs/langsmith-docker-compose.yml up -d
#
# Gateway points at it with:
#   LANGSMITH_URL=http://127.0.0.1:8090
#   LANGSMITH_API_TOKEN=<dev token>
name: cyberos-langsmith

services:
  langsmith:
    image: langchain/langsmith:0.6.0
    ports: ["8090:8080"]
    environment:
      DATABASE_URL: postgres://langsmith:pass@postgres-langsmith/langsmith
      LANGSMITH_RETENTION_DAYS: "30"
    volumes: [langsmith-data:/data]
    depends_on: [postgres-langsmith]

  postgres-langsmith:
    image: postgres:16
    environment:
      POSTGRES_USER: langsmith
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: langsmith
    volumes: [postgres-langsmith-data:/var/lib/postgresql/data]

volumes:
  langsmith-data:
  postgres-langsmith-data:
