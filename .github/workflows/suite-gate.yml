name: suite-gate

# TASK-IMP-128: run the full shell suite on ubuntu so GNU-tar-only tests execute
# and BSD-vs-GNU defects cannot hide behind a single macOS laptop pre-commit.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: test_authorship_derivation t04 git cat-file pins (TRACE-007).
          fetch-depth: 0
          persist-credentials: false
      - name: Run scripts/tests/run_all.sh
        run: bash scripts/tests/run_all.sh
